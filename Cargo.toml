[package]
description = "An all-in-one serial terminal emulator"
edition = "2021"
name = "rusty"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
futures = "0.3"
nix = "0.23"
pin-project = "1.0"
structopt = "0.3"

[dependencies.tokio]
features = ["rt-multi-thread", "io-std", "io-util", "net", "macros"]
version = "1.15"
